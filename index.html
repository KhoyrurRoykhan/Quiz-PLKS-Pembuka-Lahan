<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz Race PLKS Kelas 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Konsep: lintasan balap kartun di kebun sawit. Langit cerah, hijau pelepah, aspal gelap, aksen oranye buah sawit. */
:root{
  --sky:#8fd6f7; --sky2:#c9efff; --palm:#1f8a46; --palm-d:#0f5230; --sun:#ffc425; --orange:#ff7a1a;
  --road:#2c3340; --ink:#14233b; --paper:#f4faff; --card:#ffffff; --line:#d3e2ef; --soft:#e6f2fb;
  --ok:#1aa05a; --blue:#2f6fe4; --purple:#7d4fd1; --red:#e5484d; --muted:#586a82;
  --fd:'Baloo 2','Nunito',system-ui,sans-serif;--fl:'Lilita One','Baloo 2',system-ui,sans-serif; --fb:'Nunito',system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--fb);background:var(--paper);color:var(--ink);font-size:17px;line-height:1.45;background-image:radial-gradient(900px 420px at 8% -8%,#d4f0ff,transparent),radial-gradient(800px 420px at 100% 0,#ffeccf,transparent);background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;overflow-x:hidden}
h1,h2,h3,.disp{font-family:var(--fd);font-weight:800;line-height:1.05;margin:0}
h2{font-size:1.7rem} h3{font-size:1.25rem}
p{margin:.3em 0}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:14px;padding:.7em 1.15em;background:var(--soft);color:var(--ink);min-height:44px}
button:hover{filter:brightness(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button[disabled]{opacity:.45;cursor:not-allowed}
.btn-main{background:var(--orange);color:#fff;box-shadow:0 5px 0 #b94800}
.btn-main:active{transform:translateY(3px);box-shadow:0 2px 0 #b94800}
.btn-green{background:var(--ok);color:#fff;box-shadow:0 5px 0 #0c6a3a}
.btn-green:active{transform:translateY(3px);box-shadow:0 2px 0 #0c6a3a}
.btn-ghost{background:transparent;border:2px solid var(--line)}
.btn-danger{background:#fde8e8;color:#a32226}
.btn-lg{font-size:1.25rem;padding:.8em 1.6em;border-radius:18px}
input,select,textarea{font:inherit;font-weight:600;width:100%;padding:.65em .85em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:4.2em}
label{display:block;font-weight:800;font-size:.9rem;color:var(--muted);margin-bottom:4px}
small{color:var(--muted)}
.card{background:var(--card);border:2px solid rgba(20,35,59,.08);border-radius:22px;padding:18px;box-shadow:0 14px 30px -22px rgba(20,35,59,.55)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.hide{display:none!important}
.err{color:#a32226;background:#fde8e8;border-radius:12px;padding:.6em .9em;font-weight:700}
.note{background:#fff6d6;border:2px solid #f2d36b;border-radius:14px;padding:.7em 1em;font-weight:700;font-size:.95rem}
.tag-pill{display:inline-block;font-size:.75rem;font-weight:800;padding:.15em .6em;border-radius:99px;background:var(--soft);color:var(--muted)}

/* ===== Landing ===== */
.land{max-width:1060px;margin:0 auto;padding-block:8px 40px}
.hero{position:relative;border-radius:34px;overflow:hidden;min-height:540px;padding:42px 30px 0;background:linear-gradient(180deg,#4fbff3 0%,#a5e0fb 55%,#d9f3ff 100%);border:4px solid var(--palm-d);box-shadow:0 34px 60px -32px rgba(15,82,48,.6)}
.hero .sun{position:absolute;right:8%;top:30px;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8,var(--sun));box-shadow:0 0 0 18px rgba(255,214,70,.25),0 0 0 40px rgba(255,214,70,.12)}
.hero .cl{position:absolute;height:26px;border-radius:99px;background:#fff;opacity:.9;animation:drift 38s linear infinite}
.hero .cl::before{content:"";position:absolute;left:18%;top:-14px;width:44%;height:26px;border-radius:99px;background:#fff}
.hero .cl.c1{top:90px;width:120px;left:-140px}
.hero .cl.c2{top:170px;width:90px;left:-120px;animation-duration:52s;animation-delay:-20s}
@keyframes drift{to{transform:translateX(1400px)}}
.badge{position:relative;display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.88);border-radius:99px;padding:6px 14px 6px 10px;font-weight:800;color:var(--palm-d);font-size:.92rem;box-shadow:0 4px 0 rgba(15,82,48,.18)}
.ic{width:1.1em;height:1.1em;vertical-align:-.17em;stroke-width:2.4;flex:none}
.hero h1{position:relative;font-family:var(--fl);font-weight:400;font-size:clamp(3rem,11vw,6.6rem);color:#fff;text-shadow:0 6px 0 var(--palm-d),0 14px 0 rgba(15,82,48,.25);letter-spacing:.02em;line-height:.92;margin:16px 0 12px}
.hero h1 span{color:var(--sun)}
.hero .sub{position:relative;font-weight:800;font-size:clamp(1.05rem,2.6vw,1.4rem);color:#12406a;max-width:46ch}
.scene{position:absolute;left:0;right:0;bottom:0;height:200px;pointer-events:none}
.scene .hill{position:absolute;border-radius:50% 50% 0 0}
.scene .hill.a{left:-8%;width:60%;height:150px;bottom:70px;background:#86cd63}
.scene .hill.b{right:-12%;width:70%;height:120px;bottom:70px;background:#6bb84d}
.scene .grass{position:absolute;left:0;right:0;bottom:0;height:100px;background:linear-gradient(#58ae41,#47983a)}
.scene .palmrow{position:absolute;left:0;right:0;bottom:92px;display:flex;justify-content:space-around;align-items:flex-end}
.scene .rd{position:absolute;left:0;right:0;bottom:14px;height:64px;background:var(--road);border-top:4px solid #1a1f29;border-bottom:4px solid #1a1f29}
.scene .rd::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.7) 0 26px,transparent 26px 56px);animation:dash 1.1s linear infinite}
@keyframes dash{to{background-position-x:-56px}}
.scene .cc{position:absolute;left:-160px;animation:drive linear infinite}
.scene .cc.x1{bottom:44px;animation-duration:7s}
.scene .cc.x2{bottom:22px;animation-duration:9s;animation-delay:-3s}
.scene .cc.x3{bottom:36px;animation-duration:11s;animation-delay:-6s}
@keyframes drive{to{left:105%}}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:22px}
.role{display:flex;gap:16px;align-items:center;padding:22px;border-radius:26px;text-align:left;width:100%;background:#fff;border:2px solid rgba(20,35,59,.08);box-shadow:0 14px 30px -18px rgba(20,35,59,.45);transition:transform .2s,box-shadow .2s}
.role:hover{transform:translateY(-4px);box-shadow:0 22px 34px -18px rgba(20,35,59,.5)}
.role .big{flex:none;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:#fff;font-size:2rem}
.role .big .ic{width:34px;height:34px}
.role.rs .big{background:linear-gradient(135deg,#ff9a3c,var(--orange))}
.role.rt .big{background:linear-gradient(135deg,#2cb870,var(--palm))}
.role h3{font-size:1.7rem;margin-bottom:2px}
.role span.d{font-weight:700;color:var(--muted)}
.feats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.feats span{display:inline-flex;gap:8px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:800;color:#2a4766}

/* ===== Teacher shell ===== */
.tshell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;max-width:1240px;margin:0 auto}
.side{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;gap:6px;background:linear-gradient(170deg,#0f5230,#0b3d24);border-radius:26px;padding:16px;box-shadow:0 20px 40px -22px rgba(11,61,36,.8)}
.side .brand{display:flex;gap:10px;align-items:center;color:#fff;font-family:var(--fl);font-size:1.6rem;padding:4px 6px 12px;letter-spacing:.03em}
.side .brand small{display:block;color:#a9e0c0;font-family:var(--fb);font-size:.78rem;font-weight:800;letter-spacing:.1em}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav button{display:flex;gap:10px;align-items:center;background:transparent;color:#d6f3e2;text-align:left;border-radius:14px}
.side nav button:hover{background:rgba(255,255,255,.1)}
.side nav button.on{background:#fff;color:var(--palm-d);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.side .btn-ghost{color:#cfeedb;border-color:rgba(255,255,255,.22);margin-top:8px;display:flex;gap:8px;align-items:center}
.tmain{min-width:0;display:flex;flex-direction:column;gap:16px;padding-bottom:40px}
.tmain>div>h2,.tmain>h2{color:var(--ink)}
@media (max-width:900px){
  .tshell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;flex-direction:row;align-items:center;overflow-x:auto}
  .side .brand{display:none}
  .side nav{flex-direction:row}
  .side nav button,.side .btn-ghost{white-space:nowrap;margin:0}
}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid rgba(20,35,59,.07);border-radius:20px;padding:14px 16px;box-shadow:0 10px 24px -18px rgba(20,35,59,.5)}
.stat .si{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#e4f6ec;color:var(--palm)}
.stat .si .ic{width:24px;height:24px}
.stat b{display:block;font-family:var(--fd);font-size:2rem;color:var(--ink);line-height:1}
.stat small{font-weight:800}
.launch{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:20px 22px;border-radius:26px;color:#fff;background:linear-gradient(120deg,#0f5230,#1f8a46);box-shadow:0 20px 36px -22px rgba(15,82,48,.9)}
.launch h3{font-size:1.5rem}
.launch p{color:#d4f4e1;font-weight:700}
.quizcard{display:flex;gap:14px;align-items:flex-start;border:2px solid rgba(20,35,59,.08);border-radius:20px;padding:16px;background:#fff;cursor:pointer;text-align:left;width:100%;box-shadow:0 10px 24px -20px rgba(20,35,59,.6)}
.quizcard.on{border-color:var(--orange);background:#fff8ef}
.quizcard h3{font-size:1.3rem}
.dot{flex:none;width:26px;height:26px;border-radius:50%;border:3px solid var(--line);margin-top:2px}
.on .dot{border-color:var(--orange);background:radial-gradient(var(--orange) 45%,#fff 50%)}
.qrow{border:2px solid rgba(20,35,59,.08);border-radius:16px;background:#fff;overflow:hidden}
.qrow.off{opacity:.6}
.qhead{display:flex;gap:10px;align-items:center;padding:10px 12px;flex-wrap:wrap}
.qhead .t{flex:1;min-width:160px;font-weight:700;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qhead button{padding:.4em .8em;min-height:38px}
.qbody{padding:12px;border-top:2px solid var(--line);display:grid;gap:10px;background:#fafdff}
.optline{display:flex;gap:10px;align-items:center}
.optline input[type=radio]{width:24px;height:24px;flex:none;accent-color:var(--ok)}
.optline .ltr{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:.55em .6em;border-bottom:2px solid var(--line);text-align:left}
.tbl th{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tbl td.n,.tbl th.n{text-align:right}
.scroll-x{overflow-x:auto}
.bar{height:16px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar.bad>i{background:var(--orange)}
.switch{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:2px solid var(--line)}
.switch input{width:28px;height:28px;accent-color:var(--ok);flex:none}
.rk{display:inline-grid;place-items:center;min-width:32px;height:32px;border-radius:50%;font-family:var(--fd);font-weight:800;background:var(--soft);color:var(--ink);padding:0 6px;font-size:.95rem;flex:none}
.rk.r1{background:#ffd24a;color:#6a4a00}.rk.r2{background:#d7dfe8;color:#3d4a5a}.rk.r3{background:#f0b27a;color:#5e3410}

/* ===== Arena (lintasan lebar) ===== */
.arena{position:relative;border-radius:28px;overflow:hidden;border:4px solid var(--palm-d);box-shadow:0 26px 50px -28px rgba(15,82,48,.8);
  background:linear-gradient(#59c0f2 0,#bfeaff 70px,#a8dc7d 70.5px,#58ae41 100%);
  --lh:56px;--cw:96px;--nw:clamp(150px,18%,270px);padding-bottom:12px}
.sky{position:relative;height:104px;overflow:hidden}
.sky .sun{position:absolute;right:5%;top:10px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8,var(--sun));box-shadow:0 0 0 10px rgba(255,214,70,.3)}
.sky .cloud{position:absolute;height:18px;border-radius:99px;background:#fff;opacity:.9;animation:drift 60s linear infinite}
.sky .cloud::before{content:"";position:absolute;left:20%;top:-10px;width:44%;height:18px;border-radius:99px;background:#fff}
.sky .cloud.c1{top:16px;width:90px;left:-120px}
.sky .cloud.c2{top:40px;width:64px;left:-90px;animation-delay:-24s;animation-duration:80s}
.sky .cloud.c3{top:20px;width:76px;left:-100px;animation-delay:-45s}
.palmband{position:absolute;left:0;right:0;bottom:-6px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px;pointer-events:none}
.rbox{position:relative;margin:0 14px;border-radius:18px;overflow:hidden;background:#222938;border:3px solid #131925;box-shadow:0 10px 0 rgba(0,0,0,.18)}
.rhead{display:flex;background:#131925;color:#9fb2cc;font-size:.72rem;font-weight:800;letter-spacing:.12em}
.rhead .a{width:var(--nw);padding:7px 14px}
.rhead .b{flex:1;display:flex;justify-content:space-between;padding:7px 30px 7px 10px}
.scrollbox{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#51607a #1a2030}
.inner{position:relative}
.finish{position:absolute;top:0;bottom:0;right:0;width:24px;background:repeating-conic-gradient(#fff 0 25%,#151a24 0 50%) 0 0/12px 12px;z-index:1}
.lane{position:absolute;left:0;right:0;top:0;height:var(--lh);background:#252d3d}
.lane.alt{background:#2b3446}
.lane .nm{position:absolute;left:0;top:0;bottom:0;width:var(--nw);display:flex;align-items:center;gap:8px;padding:0 10px 0 8px;background:linear-gradient(90deg,#161c29,#1d2433);border-right:3px solid #0d121b;z-index:3;color:#fff}
.lane.lead .nm{background:linear-gradient(90deg,#4a3a05,#2a2410)}
.lane .nn{flex:1;min-width:0;font-weight:800;font-size:clamp(13px,calc(var(--lh)*.36),22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane .ss{font-variant-numeric:tabular-nums;font-weight:800;color:#ffd24a;font-size:clamp(12px,calc(var(--lh)*.31),19px)}
.lane .track{position:absolute;left:var(--nw);right:0;top:0;bottom:0;background-image:linear-gradient(90deg,transparent calc(100% - 2px),rgba(255,255,255,.09) 0);background-size:25% 100%}
.lane .track::after{content:"";position:absolute;left:0;right:26px;bottom:0;height:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.2) 0 16px,transparent 16px 34px)}
.car{position:absolute;top:50%;width:var(--cw);transform:translateY(-52%);z-index:2;left:0}
.car svg{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.car.moving::before{content:"";position:absolute;right:92%;top:30%;width:60px;height:16px;border-radius:8px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.75) 0 14px,transparent 14px 22px);opacity:.8}
.car.salip::after{content:"Salip!";position:absolute;left:30%;bottom:90%;background:var(--orange);color:#fff;font-weight:800;border-radius:99px;padding:0 10px;font-size:14px;white-space:nowrap;animation:fadeout 1.9s forwards;z-index:5}
@keyframes fadeout{0%,60%{opacity:1}100%{opacity:0}}
.arenafoot{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:10px 16px 0;font-weight:800;color:#0b3d24;font-size:.92rem;flex-wrap:wrap}
.arenafoot button{padding:.2em .9em;min-height:36px;background:rgba(255,255,255,.9);display:inline-flex;gap:6px;align-items:center}
.star{position:absolute;width:26px;height:26px;pointer-events:none;animation:rise 1.4s ease-out forwards;z-index:6}
@keyframes rise{0%{transform:translateY(0) scale(.4);opacity:0}20%{opacity:1}100%{transform:translateY(-40px) scale(1.2) rotate(40deg);opacity:0}}

/* ===== Host game ===== */
.game{max-width:1680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.hhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,#0f5230,#16693c);color:#fff;border-radius:22px;padding:12px 18px;box-shadow:0 16px 30px -20px rgba(15,82,48,.9)}
.hbrand{flex:1;min-width:220px}
.logo{font-family:var(--fl);font-weight:400;font-size:1.9rem;color:var(--sun);display:block;line-height:1;letter-spacing:.03em}
.hq{font-size:.85rem;font-weight:700;color:#cdeedb}
.hstats{display:flex;gap:10px;flex-wrap:wrap}
.hstats div{text-align:center;background:rgba(255,255,255,.1);border-radius:14px;padding:4px 14px;min-width:84px}
.hstats small{display:block;color:#a8dcbc;font-weight:800;font-size:.66rem;letter-spacing:.1em}
.hstats b{font-family:var(--fd);font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.2}
.hctl{display:flex;gap:8px;flex-wrap:wrap}
.hctl button{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.14);color:#fff;padding:.4em .9em}
.hctl .btn-danger{background:#ffd9d9;color:#8c1d20}
.lobby2{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:900px){.lobby2{grid-template-columns:minmax(0,1fr)}}
.lcard{border-radius:28px;padding:22px;border:2px solid rgba(20,35,59,.08);box-shadow:0 20px 40px -26px rgba(20,35,59,.6);background:#fff}
.lcode{display:grid;gap:12px;justify-items:center;text-align:center;background:linear-gradient(#bfeaff,#e9f8ff);border:4px solid var(--palm-d)}
.lcode .ttl{font-family:var(--fd);font-weight:800;font-size:1.25rem;color:var(--palm-d);line-height:1.1}
.lcode .code{font-family:var(--fl);font-size:clamp(3.2rem,9vw,5.8rem);letter-spacing:.1em;background:#fff;border-radius:22px;padding:0 .35em;border:4px solid var(--palm-d);box-shadow:0 8px 0 rgba(15,82,48,.3);color:var(--palm-d);line-height:1.2;font-variant-numeric:tabular-nums}
.qrwrap{background:#fff;border-radius:18px;padding:12px;border:3px solid var(--palm-d)}
.qrwrap img,.qrwrap canvas{display:block;max-width:100%;height:auto}
.lcode .how{font-weight:800;font-size:.95rem}
.lcode .url{font-family:ui-monospace,monospace;background:#fff;border-radius:10px;padding:.1em .6em;word-break:break-all}
.lplayers{display:flex;flex-direction:column;gap:14px;min-height:340px}
.lplayers h3{display:flex;gap:10px;align-items:center;font-size:1.6rem}
.lplayers h3 .cnt{background:var(--orange);color:#fff;border-radius:99px;padding:0 .6em;font-size:1.2rem}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;align-content:start;flex:1;max-height:48vh;overflow:auto;padding:2px}
.chip{display:flex;align-items:center;gap:8px;background:#f2f9ff;border-radius:16px;padding:4px 6px 4px 10px;font-weight:800;border:2px solid var(--line)}
.chip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.off{opacity:.5}
.chip button{padding:0;min-height:28px;width:28px;border-radius:50%;background:#fde8e8;color:#a32226;line-height:1;flex:none}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:700;padding:40px 10px;grid-column:1/-1}

<div id="app"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
'use strict';
/* =====================================================================
   QUIZ RACE · PLKS Kelas 3 — satu berkas, tanpa server sendiri.
   Guru = "host" (mengatur permainan, menghitung skor). Siswa tersambung
   langsung ke perangkat guru lewat PeerJS (WebRTC). Kunci jawaban hanya
   dikirim ke siswa setelah waktu soal berakhir.
   ===================================================================== */
const PEER_PREFIX='plks3-ramah-';
const $=(s,e=document)=>e.querySelector(s);
const $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('id-ID');
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const LETTERS=['A','B','C','D'];

/* ---------- Suara ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.15,type='sine',v=.15,when=0){
  if(!SET.sound)return;const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
  const t=a.currentTime+when;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);
}
const sfx={
  ok(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.18,i*.08))},
  tick(){tone(660,.1,'square',.07)},
  go(){tone(988,.4,'square',.1)},
  click(){tone(520,.06,'sine',.1)},
  soft(){tone(350,.22,'sine',.1)},
  join(){tone(700,.08,'sine',.1);tone(940,.1,'sine',.1,.08)},
  win(){[523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.18,i*.12))}
};
let musicT=null,musicI=0;
const SEMI=[0,4,7,12,9,7,4,2];
function syncMusic(){
  const want=SET.sound&&SET.music&&(G.active||S.role==='student');
  if(want&&!musicT){musicT=setInterval(()=>{if(!(SET.sound&&SET.music))return;tone(261.63*Math.pow(2,SEMI[musicI++%8]/12),.32,'triangle',.045)},420)}
  if(!want&&musicT){clearInterval(musicT);musicT=null}
}

/* ---------- Kendaraan ---------- */
const VEH=[
  {n:'Merah',c:'#e53935',t:0},{n:'Biru',c:'#2f6fe4',t:1},{n:'Kuning',c:'#ffc21a',t:2},{n:'Hijau',c:'#2ea84f',t:3},
  {n:'Ungu',c:'#8a4fd6',t:0},{n:'Oranye',c:'#ff8a1f',t:1},{n:'Putih',c:'#f4f7fb',t:4},{n:'Hitam',c:'#2a2f3a',t:4}
];
function carSVG(i,w){
  const v=VEH[((i%8)+8)%8],c=v.c,st='#1b2230';
  const win='#bfe6fb';
  let body='';
  if(v.t===0)body=`<rect x="6" y="20" width="90" height="14" rx="6" fill="${c}" stroke="${st}" stroke-width="2"/><path d="M24 20 L33 8 H64 L77 20Z" fill="${c}" stroke="${st}" stroke-width="2" stroke-linejoin="round"/><path d="M30 19 L36 11 H47 V19Z M51 19 V11 H62 L70 19Z" fill="${win}"/>`;
  if(v.t===1)body=`<rect x="5" y="22" width="92" height="12" rx="6" fill="${c}" stroke="${st}" stroke-width="2"/><path d="M30 22 L41 11 H62 L80 22Z" fill="${c}" stroke="${st}" stroke-width="2" stroke-linejoin="round"/><path d="M37 21 L44 13.5 H60 L71 21Z" fill="${win}"/><rect x="4" y="13" width="12" height="3.5" rx="1.5" fill="${st}"/><rect x="8" y="16" width="3" height="8" fill="${st}"/>`;
  if(v.t===2)body=`<rect x="6" y="18" width="90" height="16" rx="5" fill="${c}" stroke="${st}" stroke-width="2"/><rect x="22" y="6" width="52" height="14" rx="3" fill="${c}" stroke="${st}" stroke-width="2"/><rect x="26" y="9" width="20" height="9" fill="${win}"/><rect x="50" y="9" width="20" height="9" fill="${win}"/><path d="M24 4 H72" stroke="${st}" stroke-width="2.5"/><circle cx="6" cy="27" r="6" fill="#333" stroke="${st}" stroke-width="2"/>`;
  if(v.t===3)body=`<rect x="6" y="9" width="90" height="25" rx="8" fill="${c}" stroke="${st}" stroke-width="2"/><rect x="12" y="13" width="17" height="10" rx="2" fill="${win}"/><rect x="33" y="13" width="17" height="10" rx="2" fill="${win}"/><rect x="54" y="13" width="17" height="10" rx="2" fill="${win}"/><path d="M76 13 H88 Q92 13 92 17 V23 H76Z" fill="${win}"/>`;
  if(v.t===4){const s=(c==='#2a2f3a')?'#ffc21a':'#e53935';body=`<path d="M4 33 L4 26 Q10 22 28 21 L44 11 H66 L82 21 Q97 24 97 33Z" fill="${c}" stroke="${st}" stroke-width="2" stroke-linejoin="round"/><path d="M47 14 H64 L76 21 H42Z" fill="${win}"/><rect x="4" y="26" width="92" height="3.5" fill="${s}"/><rect x="3" y="12" width="14" height="3.5" rx="1.5" fill="${st}"/><rect x="8" y="15" width="3" height="9" fill="${st}"/><circle cx="52" cy="29" r="0" fill="none"/>`}
  return `<svg viewBox="0 0 100 46" xmlns="http://www.w3.org/2000/svg" ${w?`width="${w}"`:''} aria-label="Mobil ${v.n}"><ellipse cx="50" cy="43" rx="42" ry="3" fill="rgba(0,0,0,.28)"/>${body}<circle cx="27" cy="34" r="8" fill="#222" stroke="${st}" stroke-width="1.5"/><circle cx="27" cy="34" r="3.2" fill="#cfd6df"/><circle cx="75" cy="34" r="8" fill="#222" stroke="${st}" stroke-width="1.5"/><circle cx="75" cy="34" r="3.2" fill="#cfd6df"/><circle cx="96" cy="28" r="2.6" fill="#ffe36b"/><circle cx="5" cy="28" r="2" fill="#ff5050"/></svg>`;
}
function palmSVG(h){
  const fr=[-175,-140,-105,-75,-40,-5].map(a=>`<ellipse cx="22" cy="0" rx="22" ry="5.5" transform="rotate(${a})" fill="#1f8a46" stroke="#0f5230" stroke-width="1"/>`).join('');
  return `<svg viewBox="-40 -110 90 112" height="${h}" xmlns="http://www.w3.org/2000/svg"><path d="M2 0 C4 -30 0 -60 4 -88" stroke="#7a4b24" stroke-width="7" fill="none" stroke-linecap="round"/><g transform="translate(4 -88)">${fr}<circle cx="0" cy="3" r="5" fill="#e8631a"/><circle cx="-5" cy="6" r="4" fill="#c94f10"/></g></svg>`;
}
const STAR='<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z" fill="#ffc425" stroke="#c98a00" stroke-width="1.2"/></svg>';

/* ---------- Data awal ---------- */
function Q(text,opts,c,exp){return{id:uid(),text,options:opts,correct:c,explanation:exp,duration:20,points:1000,use:true}}
function defaultQuiz(){return{id:'plks3-m8',title:'PLKS Kelas 3 — Membuka Lahan Ramah Lingkungan',description:'Budidaya kelapa sawit: cara membuka lahan yang benar dan ramah lingkungan.',subject:'Pendidikan Lingkungan Kebun Sawit (PLKS)',grade:'3 SD',questions:[
 Q('Langkah pertama dalam budidaya kelapa sawit adalah ....',['Pembibitan','Pembukaan lahan','Pemeliharaan','Pemanenan'],1,'Pembukaan lahan merupakan tahap awal untuk menyiapkan tempat menanam bibit kelapa sawit.'),
 Q('Pak Tani ingin membuat kebun sawit yang ramah lingkungan. Lahan yang sebaiknya dipilih adalah ....',['Hutan lindung','Hutan yang masih lebat','Lahan kosong yang sudah tidak terpakai','Kawasan tempat tinggal hewan liar'],2,'Lahan yang sudah tidak terpakai dapat dipilih sesuai ketentuan yang berlaku. Hutan lindung tidak boleh dibuka.'),
 Q('Bagaimana cara membersihkan lahan yang ramah lingkungan?',['Membakar seluruh semak','Menyemprotkan bahan kimia berbahaya','Membuang sampah ke sungai','Menebas semak menggunakan alat sederhana'],3,'Membersihkan lahan secara manual menggunakan alat sederhana membantu mengurangi kerusakan lingkungan.'),
 Q('Apa yang sebaiknya dilakukan terhadap sisa tebasan semak?',['Dibakar sampai habis','Ditumpuk rapi dan dibiarkan membusuk','Dibuang ke sungai','Dibiarkan berserakan di jalan'],1,'Sisa tebasan ditumpuk dengan rapi dan dibiarkan membusuk sehingga dapat menjadi pupuk alami.'),
 Q('Setelah lahan dibersihkan, apa yang dilakukan Pak Tani sebelum menanam bibit sawit?',['Membakar tanah','Menebang hutan lindung','Memasang patok dan membuat lubang tanam','Membuang sisa tebasan ke sungai'],2,'Setelah lahan dibersihkan, Pak Tani memasang patok dan membuat lubang tanam sebagai persiapan penanaman bibit.'),
 Q('Mengapa kita tidak boleh membakar lahan?',['Asap mengotori udara dan api dapat menjalar','Api membuat hutan semakin sehat','Hewan menyukai asap','Tanah harus selalu dibakar'],0,'Asap dapat menyebabkan gangguan pernapasan dan mengotori udara. Api juga dapat menjalar ke hutan dan kebun lain.'),
 Q('Mengapa hutan lindung tidak boleh dibuka untuk kebun sawit?',['Karena hutan hanya boleh dikunjungi saat liburan','Karena hutan tidak memiliki manfaat','Karena hutan hanya tempat tumbuhnya rumput','Karena hutan menjadi rumah hewan dan tumbuhan serta membantu menjaga air dan udara'],3,'Hutan merupakan rumah bagi berbagai hewan dan tumbuhan serta membantu menjaga kebersihan udara dan air.'),
 Q('Manakah tindakan yang menunjukkan pembukaan lahan ramah lingkungan?',['Membakar semak agar cepat bersih','Memakai lahan yang tidak terpakai dan tidak membakar lahan','Membuka kawasan hutan lindung','Menggunakan bahan kimia berbahaya'],1,'Pembukaan lahan ramah lingkungan dilakukan dengan memanfaatkan lahan yang sesuai, tidak membuka hutan lindung, dan tidak membakar lahan.'),
 Q('Manakah urutan pembukaan lahan yang benar?',['Membuat lubang tanam → membakar lahan → memilih lahan → membersihkan lahan','Membersihkan lahan → memilih lahan → membakar sisa tebasan → membuat lubang tanam','Memilih lahan → membersihkan secara manual → menumpuk sisa tebasan tanpa membakar → menyiapkan lubang tanam','Menumpuk sisa tebasan → memilih lahan → membuat lubang tanam → membersihkan lahan'],2,'Urutan yang benar adalah memilih lahan, membersihkan secara manual, menumpuk sisa tebasan tanpa membakar, kemudian menyiapkan lubang tanam.'),
 Q('Pak Tani menemukan lahan kosong yang sudah lama tidak digunakan dan ditumbuhi semak. Apa tindakan terbaik yang seharusnya dilakukan?',['Membakar semua semak agar cepat bersih','Membuka hutan lindung di dekatnya','Membuang semua sisa tebasan ke sungai','Membersihkan lahan secara manual dan menumpuk sisa tebasan tanpa membakarnya'],3,'Pak Tani sebaiknya membersihkan lahan dengan cara manual dan menumpuk sisa tebasan tanpa membakar agar lingkungan tetap terjaga.')
]}}

/* ---------- State ---------- */
const SET=Object.assign({bonus:true,auto:false,shuffleQ:false,shuffleO:false,sound:true,music:false,resultSec:9},store.get('plks_set_v1',{}));
let QUIZZES=store.get('plks_quizzes_v1',null);
if(!Array.isArray(QUIZZES)||!QUIZZES.length)QUIZZES=[defaultQuiz()];
let HISTORY=store.get('plks_hist_v1',[]);
const S={role:null,tview:'dash',selQuiz:store.get('plks_sel',null),open:{},confirm:null,reportId:null,form:{code:'',name:'',veh:-1},};
if(!QUIZZES.find(q=>q.id===S.selQuiz))S.selQuiz=QUIZZES[0].id;
const saveQ=()=>store.set('plks_quizzes_v1',QUIZZES);
const saveSet=()=>store.set('plks_set_v1',SET);
const curQuiz=()=>QUIZZES.find(q=>q.id===S.selQuiz)||QUIZZES[0];
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}

/* =====================================================================
   HOST (GURU)
   ===================================================================== */
const G={active:false,phase:'lobby',code:'',peer:null,netErr:'',netOK:false,players:new Map(),qs:[],qi:-1,optOrder:[0,1,2,3],dur:20000,elapsed:0,runStart:0,running:false,tick:null,timers:[],count:3,qStats:[],arena:null,showAll:false,board:false,preview:false,startedAt:0,saved:false};

function elapsed(){return G.elapsed+(G.running?Date.now()-G.runStart:0)}
function remaining(){return Math.max(0,G.dur-elapsed())}
const curQ=()=>G.qs[G.qi];
const plist=()=>[...G.players.values()];
const onlineN=()=>plist().filter(p=>p.online).length;
const answeredN=()=>plist().filter(p=>p.online&&p.ans[G.qi]).length;
function scorePts(ms,dur,max,bonus){return bonus?Math.round(max/2+max/2*Math.max(0,dur-ms)/dur):max}
function later(fn,ms){const t=setTimeout(fn,ms);G.timers.push(t);return t}
function clearTimers(){G.timers.forEach(clearTimeout);G.timers=[];clearInterval(G.tick);G.tick=null}

function computeRanks(){
  const a=plist().sort((x,y)=>y.score-x.score||y.ok-x.ok||x.okMs-y.okMs||x.name.localeCompare(y.name));
  a.forEach((p,i)=>{p.rank=i+1});return a;
}
function newPlayer(pid,name,veh,conn,bot){
  return{pid,name,veh,conn,bot:!!bot,online:true,lastSeen:Date.now(),score:0,ok:0,okMs:0,ans:{},rank:0,prevRank:0,plan:null};
}
function sendTo(p,m){if(p&&p.conn&&p.conn.open){try{p.conn.send(m)}catch(e){}}}
function bcast(m){plist().forEach(p=>{if(p.online)sendTo(p,m)})}

function openRoom(){
  clearTimers();
  Object.assign(G,{active:true,phase:'lobby',netErr:'',netOK:false,players:new Map(),qs:[],qi:-1,qStats:[],board:false,showAll:true,preview:false,saved:false,code:'······'});
  buildArena();
  if(typeof Peer==='undefined'){G.netErr='Tidak bisa memuat PeerJS. Periksa internet. Kamu tetap bisa mencoba mode pratinjau.';render();return}
  tryOpen(0);render();
}
function tryOpen(n){
  const code=String(Math.floor(100000+Math.random()*900000));
  let peer;
  try{peer=new Peer(PEER_PREFIX+code)}catch(e){G.netErr='Gagal membuka ruang: '+e.message;render();return}
  peer.on('open',()=>{G.peer=peer;G.code=code;G.netOK=true;G.netErr='';render()});
  peer.on('error',err=>{
    if(err.type==='unavailable-id'&&n<6){try{peer.destroy()}catch(e){}tryOpen(n+1);return}
    G.netOK=false;G.netErr=(err.type==='network'||err.type==='server-error'||err.type==='socket-error'||err.type==='socket-closed')?'Tidak bisa terhubung ke server penghubung. Periksa internet. Mode pratinjau tetap bisa dipakai.':'Terjadi masalah koneksi ('+err.type+').';
    if(G.active)render();
  });
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('connection',hostConn);
}
function hostConn(c){
  c.on('data',m=>onHostMsg(c,m));
  const gone=()=>{const p=plist().find(p=>p.conn===c);if(p){p.online=false;p.conn=null;hostRefresh()}};
  c.on('close',gone);c.on('error',gone);
}
function cleanName(s){return String(s||'').replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,14)}
function onHostMsg(c,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='join'){
    const name=cleanName(m.name);
    if(!/^[a-z0-9]{4,16}$/i.test(String(m.pid||'')))return;
    let p=G.players.get(m.pid);
    if(p&&!p.bot){p.conn=c;p.online=true;p.lastSeen=Date.now();sendTo(p,{t:'joined',pid:p.pid,name:p.name,veh:p.veh});sendStateTo(p);hostRefresh();return}
    if(!name){c.send({t:'err',msg:'Tulis nama panggilanmu dulu ya.'});return}
    if(plist().some(x=>x.name.toLowerCase()===name.toLowerCase())){c.send({t:'err',msg:'Nama itu sudah dipakai. Pilih nama lain ya.'});return}
    let veh=Number.isInteger(m.veh)&&m.veh>=0&&m.veh<8?m.veh:-1;
    const used=new Set(plist().map(x=>x.veh));
    if(veh<0||(used.has(veh)&&used.size<8)){const free=shuf([0,1,2,3,4,5,6,7].filter(i=>!used.has(i)));veh=free.length?free[0]:Math.floor(Math.random()*8)}
    p=newPlayer(m.pid,name,veh,c,false);G.players.set(p.pid,p);
    sendTo(p,{t:'joined',pid:p.pid,name:p.name,veh:p.veh});sendStateTo(p);sfx.join();
    if(G.phase!=='lobby'){computeRanks()}
    hostRefresh();return;
  }
  const p=plist().find(x=>x.conn===c);if(!p)return;
  p.lastSeen=Date.now();
  if(m.t==='ans')handleAnswer(p,m);
}
function handleAnswer(p,m){
  if(G.phase!=='q'||!G.running||m.qi!==G.qi||p.ans[G.qi])return;
  const opt=m.opt;if(!Number.isInteger(opt)||opt<0||opt>3)return;
  const q=curQ(),ms=clamp(elapsed(),0,G.dur),ok=opt===q.correct;
  p.ans[G.qi]={opt,ms,ok,pts:ok?scorePts(ms,G.dur,q.points||1000,SET.bonus):0};
  sendTo(p,{t:'ack',qi:G.qi});
  hostLive();
  if(answeredN()>=onlineN())later(()=>{if(G.phase==='q'&&answeredN()>=onlineN())endQuestion()},900);
}
function sendStateTo(p){
  switch(G.phase){
    case 'lobby':sendTo(p,{t:'lobby',n:G.players.size});break;
    case 'count':sendTo(p,{t:'count',c:G.count});break;
    case 'q':sendTo(p,qPayload(p));break;
    case 'res':sendTo(p,resPayload(p));break;
    case 'fin':sendTo(p,finPayload(p));break;
  }
}
function qPayload(p){
  const q=curQ(),a=p&&p.ans[G.qi];
  return{t:'q',qi:G.qi,n:G.qs.length,text:q.text,opts:G.optOrder.map(k=>({k,txt:q.options[k]})),dur:G.dur,rem:remaining(),picked:a?a.opt:null,paused:!G.running};
}
function topList(n){return computeRanks().slice(0,n).map(p=>({n:p.name,s:p.score,v:p.veh,pid:p.pid}))}
function resPayload(p){
  const q=G.qs[G.qi],a=p.ans[G.qi],st=G.qStats[G.qStats.length-1]||{};
  return{t:'res',qi:G.qi,n:G.qs.length,correct:q.correct,explanation:q.explanation,answered:!!a,picked:a?a.opt:null,ok:!!(a&&a.ok),pts:a?a.pts:0,total:p.score,rank:p.rank,of:G.players.size,okN:st.okN||0,ansN:st.total||0,top:topList(5),opts:G.qs[G.qi].options,last:G.qi>=G.qs.length-1};
}
function finPayload(p){
  const rows=computeRanks();
  return{t:'fin',rank:p.rank,of:rows.length,total:p.score,ok:p.ok,n:G.qs.length,top:rows.slice(0,3).map(r=>({n:r.name,s:r.score,v:r.veh,pid:r.pid}))};
}

function startGame(){
  const quiz=curQuiz();
  const used=quiz.questions.filter(q=>q.use!==false);
  if(!used.length){toast('Pilih minimal satu soal di Bank Soal.');return}
  for(const q of used){if(!String(q.text||'').trim()||q.options.some(o=>!String(o||'').trim())){toast('Ada soal yang belum lengkap. Cek di Bank Soal.');return}}
  if(!G.players.size){toast('Belum ada peserta. Coba mode pratinjau.');return}
  clearTimers();
  G.qs=(SET.shuffleQ?shuf(used):used).map(q=>JSON.parse(JSON.stringify(q)));
  G.qi=-1;G.qStats=[];G.saved=false;G.startedAt=Date.now();
  plist().forEach(p=>{p.score=0;p.ok=0;p.okMs=0;p.ans={};p.rank=0;p.prevRank=0});
  computeRanks();updateArena(true);
  G.phase='count';G.count=3;bcast({t:'count',c:3});sfx.tick();render();
  const step=()=>{
    G.count--;
    if(G.count>0){bcast({t:'count',c:G.count});sfx.tick();render();later(step,1000)}
    else{G.count=0;bcast({t:'count',c:0});sfx.go();render();later(nextQuestion,900)}
  };
  later(step,1000);
}
function nextQuestion(){
  clearTimers();
  G.qi++;
  if(G.qi>=G.qs.length){finishGame();return}
  const q=curQ();
  G.phase='q';G.dur=clamp((q.duration||20),5,120)*1000;G.elapsed=0;G.runStart=Date.now();G.running=true;
  G.optOrder=SET.shuffleO?shuf([0,1,2,3]):[0,1,2,3];
  plist().forEach(p=>{
    if(p.bot){const ok=Math.random()<.7;const other=shuf([0,1,2,3].filter(k=>k!==q.correct))[0];p.plan={ms:2500+Math.random()*(G.dur*.65),opt:ok?q.correct:other}}
  });
  plist().forEach(p=>{if(p.online)sendTo(p,qPayload(p))});
  render();
  G.tick=setInterval(()=>{
    if(!G.running)return;
    plist().forEach(p=>{if(p.bot&&p.plan&&!p.ans[G.qi]&&elapsed()>=p.plan.ms)handleAnswer(p,{qi:G.qi,opt:p.plan.opt})});
    hostLive();
    if(remaining()<=0)endQuestion();
  },200);
}
function endQuestion(){
  if(G.phase!=='q')return;
  clearTimers();G.running=false;
  const q=curQ();
  plist().forEach(p=>{p.prevRank=p.rank;const a=p.ans[G.qi];if(a&&a.ok){p.score+=a.pts;p.ok++;p.okMs+=a.ms}});
  computeRanks();
  const all=plist(),total=all.filter(p=>p.ans[G.qi]).length,okN=all.filter(p=>p.ans[G.qi]&&p.ans[G.qi].ok).length;
  G.qStats.push({text:q.text,okN,total,of:all.length,counts:[0,1,2,3].map(k=>all.filter(p=>p.ans[G.qi]&&p.ans[G.qi].opt===k).length)});
  G.phase='res';
  plist().forEach(p=>{if(p.online)sendTo(p,resPayload(p))});
  render();updateArena(false,true);
  sfx.ok();
  if(SET.auto)later(()=>{if(G.phase==='res')nextQuestion()},clamp(SET.resultSec,4,30)*1000);
}
function pauseGame(){if(G.phase!=='q'||!G.running)return;G.elapsed=elapsed();G.running=false;bcast({t:'pause'});render()}
function resumeGame(){if(G.phase!=='q'||G.running)return;G.runStart=Date.now();G.running=true;bcast({t:'resume',rem:remaining()});render()}
function finishGame(){
  clearTimers();G.running=false;G.phase='fin';
  const rows=computeRanks();
  const n=G.qs.length;
  if(!G.saved&&rows.some(p=>!p.bot)){
    G.saved=true;
    const rep={id:uid(),date:Date.now(),title:curQuiz().title,n:rows.length,nq:n,
      rows:rows.map(p=>{const ans=Object.values(p.ans).length;return{rank:p.rank,name:p.name,score:p.score,ok:p.ok,wrong:ans-p.ok,un:Math.max(0,n-ans),avg:p.ok?Math.round(p.okMs/p.ok)/1000:null,bot:p.bot}}),
      qs:G.qStats.map(s=>({text:s.text,okN:s.okN,total:s.of,pct:s.of?Math.round(100*s.okN/s.of):0}))};
    HISTORY.unshift(rep);HISTORY=HISTORY.slice(0,30);store.set('plks_hist_v1',HISTORY);S.reportId=rep.id;
  }
  plist().forEach(p=>{if(p.online)sendTo(p,finPayload(p))});
  render();sfx.win();celebrate();
}
function playAgain(){
  clearTimers();G.phase='lobby';G.qi=-1;G.running=false;G.saved=false;
  plist().forEach(p=>{p.score=0;p.ok=0;p.okMs=0;p.ans={};p.rank=0;p.prevRank=0});
  bcast({t:'lobby',n:G.players.size});updateArena(true);render();
}
function leaveRoom(){
  clearTimers();bcast({t:'end'});
  setTimeout(()=>{try{G.peer&&G.peer.destroy()}catch(e){}G.peer=null},300);
  G.active=false;G.phase='lobby';G.players=new Map();S.tview='dash';syncMusic();render();
}
function kick(pid){const p=G.players.get(pid);if(!p)return;sendTo(p,{t:'kicked'});try{p.conn&&p.conn.close()}catch(e){}G.players.delete(pid);computeRanks();hostRefresh()}
function addBots(){
  const names=['Andi','Siti','Budi','Rina','Dewi','Joko'];
  names.forEach((n,i)=>{if(![...G.players.values()].some(p=>p.name===n)){const p=newPlayer('bot'+i+uid(),n,i,null,true);G.players.set(p.pid,p)}});
  G.preview=true;hostRefresh();
}
function hostRefresh(){if(!G.active)return;if(G.phase==='lobby'||G.phase==='fin'||G.board)render();else{hostLive();updateArena()}}
function hostLive(){
  const t=$('#hTime');
  if(t&&G.phase==='q'){const r=Math.ceil(remaining()/1000);t.textContent=r;t.classList.toggle('low',r<=5);const b=$('#hBar');if(b)b.style.width=(100*remaining()/G.dur)+'%'}
  const a=$('#hAns');if(a)a.textContent=answeredN()+'/'+onlineN();
}
setInterval(()=>{ // tandai siswa yang tidak terdengar
  if(!G.active)return;let ch=false;
  plist().forEach(p=>{if(!p.bot&&p.online&&Date.now()-p.lastSeen>20000){p.online=false;ch=true}});
  if(ch)hostRefresh();
},5000);

const ic=(n,cls)=>`<i data-lucide="${n}" class="ic ${cls||''}"></i>`;
function buildArena(){
  const el=document.createElement('div');el.className='arena';
  el.innerHTML=`<div class="sky"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div class="palmband">${Array.from({length:16},(_,i)=>palmSVG(60+((i*37)%32))).join('')}</div></div>
  <div class="rbox"><div class="rhead"><div class="a">PEMBALAP</div><div class="b"><span>START</span><span class="fl">FINISH</span></div></div>
    <div class="scrollbox"><div class="inner"><div class="finish"></div></div></div></div>
  <div class="arenafoot"><span class="more"></span><span class="row" style="gap:8px"><button data-act="toggleAll" class="allbtn"></button><button data-act="board">${ic('users')} Papan skor lengkap</button></span></div>`;
  G.arena=el;
}
function setPos(car,v){car.style.left=`calc((100% - var(--cw) - 26px) * ${v})`}
function tweenCar(ln,car,v,instant){
  const st=ln._st||(ln._st={v:0});
  if(instant||!window.gsap){if(window.gsap)gsap.killTweensOf(st);st.v=v;setPos(car,v);car.classList.remove('moving');return}
  if(Math.abs(st.v-v)<0.0005){return}
  car.classList.add('moving');
  gsap.to(st,{v,duration:2,ease:'power3.inOut',overwrite:true,onUpdate:()=>setPos(car,st.v),onComplete:()=>car.classList.remove('moving')});
}
function moveLane(ln,y,instant){
  if(!window.gsap){ln.style.transform=`translateY(${y}px)`;return}
  if(instant||!ln._init){ln._init=true;gsap.set(ln,{y});return}
  gsap.to(ln,{y,duration:.9,ease:'power2.inOut',overwrite:'auto'});
}
function updateArena(reset,celebrate){
  const el=G.arena;if(!el)return;
  const rows=computeRanks(),n=rows.length;
  const inner=$('.inner',el),box=$('.scrollbox',el);
  const vis=(G.showAll||n<=10)?n:10;
  const avail=Math.round(window.innerHeight*(vis>14?0.6:0.5));
  const lh=clamp(Math.floor(avail/Math.max(1,Math.min(vis,14))),38,76);
  el.style.setProperty('--lh',lh+'px');
  el.style.setProperty('--cw',Math.round(lh*1.75)+'px');
  inner.style.height=Math.max(1,vis)*lh+'px';
  box.style.maxHeight=avail+'px';
  const keep=new Set();
  const totalMax=Math.max(1,(G.qs.length||10))*1000;
  rows.forEach(p=>{
    keep.add(p.pid);
    let ln=inner.querySelector(`[data-pid="${p.pid}"]`);
    if(!ln){
      ln=document.createElement('div');ln.className='lane';ln.dataset.pid=p.pid;
      ln.innerHTML=`<div class="nm"><span class="rk"></span><span class="nn"></span><span class="ss"></span></div><div class="track"><div class="car">${carSVG(p.veh)}</div></div>`;
      inner.appendChild(ln);
    }
    const car=$('.car',ln),hidden=p.rank>vis;
    ln.style.display=hidden?'none':'';
    ln.classList.toggle('alt',p.rank%2===0);
    ln.classList.toggle('lead',p.rank===1&&p.score>0);
    moveLane(ln,(p.rank-1)*lh,reset);
    const rk=$('.rk',ln);rk.className='rk'+(p.rank<=3?' r'+p.rank:'');rk.textContent=p.rank;
    const nn=$('.nn',ln);nn.textContent=p.name;nn.title=p.name;
    $('.ss',ln).textContent=fmt(p.score);
    const pos=reset?0:clamp(p.score/totalMax,0,1);
    tweenCar(ln,car,pos,reset);
    if(celebrate&&p.prevRank&&p.rank<p.prevRank&&p.score>0){car.classList.remove('salip');void car.offsetWidth;car.classList.add('salip');setTimeout(()=>car.classList.remove('salip'),2000)}
    if(celebrate){const a=p.ans[G.qi];if(a&&a.ok&&!hidden){const s=document.createElement('div');s.className='star';s.innerHTML=STAR;s.style.left=`calc(var(--nw) + (100% - var(--nw) - var(--cw) - 26px) * ${pos} + var(--cw) * .55)`;s.style.top='4px';ln.appendChild(s);setTimeout(()=>s.remove(),1500)}}
  });
  $$('.lane',inner).forEach(l=>{if(!keep.has(l.dataset.pid))l.remove()});
  $('.more',el).textContent=n>vis?`Menampilkan ${vis} dari ${n} peserta`:`${n} peserta`;
  const ab=$('.allbtn',el);ab.textContent=G.showAll?'Ringkas: 10 teratas':'Tampilkan semua';ab.style.display=n>10?'':'none';
  $('.fl',el).textContent='FINISH · '+fmt(totalMax)+' poin';
}

    </div>`;
  }else if(G.phase==='fin'){
    const rows=computeRanks(),top=rows.slice(0,3);
    const order=top.length>=3?[1,0,2]:top.length===2?[1,0]:[0];
    body=`<div class="podium">${order.map(i=>{const p=top[i];return `<div class="pod p${i+1}">${carSVG(p.veh,120)}<div class="nm">${esc(p.name)}</div><div class="pt">${fmt(p.score)} poin</div><div class="blk">${i+1}</div></div>`}).join('')}</div>
    <div class="lcard"><h3 style="margin-bottom:10px">Papan skor lengkap</h3><div class="board scroll-x">${boardTable(rows)}</div>
    <div class="row" style="margin-top:14px"><button class="btn-main" data-act="again">${ic('flag')} Main Lagi</button><button class="btn-green" data-act="toreport">${ic('trophy')} Lihat Laporan Nilai</button><button data-act="leave">Kembali ke Dashboard</button></div></div>`;
  }
  const board=G.board?`<div class="overlay" data-act="closeboard"><div class="card"><div class="row" style="justify-content:space-between"><h3>Papan skor lengkap</h3><button data-act="closeboard">Tutup</button></div><div class="board scroll-x" style="max-height:60vh">${boardTable(computeRanks(),true)}</div></div></div>`:'';
  return `<div class="game">${head}${body}</div>${board}`;
}

function csvOf(rep){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const lines=[['Peringkat','Nama','Total Skor','Jawaban Benar','Jawaban Salah','Tidak Dijawab','Rata-rata Waktu Jawaban Benar (detik)'].map(q).join(',')];
  rep.rows.forEach(r=>lines.push([r.rank,q(r.name),r.score,r.ok,r.wrong,r.un,r.avg==null?'':String(r.avg).replace('.',',')].join(',')));
  return '﻿'+lines.join('\r\n');
}
function downloadCSV(rep){
  const blob=new Blob([csvOf(rep)],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='laporan-quiz-race-'+new Date(rep.date).toISOString().slice(0,10)+'.csv';

}

/* =====================================================================
   SISWA
   ===================================================================== */
const ME={status:'idle',peer:null,conn:null,pid:'',name:'',veh:-1,code:'',joined:false,stop:false,err:'',q:null,deadline:0,pausedRem:0,paused:false,picked:null,res:null,fin:null,count:0,lobbyN:0,toT:null,retryT:null,pingT:null,qi:-1};
const sess=store.get('plks_me',null);
function sJoin(){
  const f=S.form,code=(f.code||'').replace(/\D/g,'').slice(0,6),name=cleanName(f.name);
  if(code.length!==6){ME.err='Kode permainan terdiri dari 6 angka.';render();return}
  if(!name){ME.err='Tulis nama panggilanmu dulu ya.';render();return}
  if(typeof Peer==='undefined'){ME.err='Tidak bisa terhubung ke internet. Coba lagi ya.';render();return}
  ME.code=code;ME.name=name;ME.veh=f.veh;ME.stop=false;ME.joined=false;ME.err='';
  const old=store.get('plks_me',null);
  ME.pid=(old&&old.code===code&&old.pid)?old.pid:uid()+uid().slice(0,3);
  ME.status='connecting';ac();render();sConnect();
}
function sConnect(){
  if(!ME.peer||ME.peer.destroyed){
    const p=new Peer();ME.peer=p;
    p.on('open',()=>sDial());
    p.on('error',e=>{
      if(e.type==='peer-unavailable'){ if(!ME.joined)sFail('Kode tidak ditemukan atau permainan sudah selesai. Cek kodenya lagi ya.'); else sRetry(); }
      else if(!ME.joined)sFail('Tidak bisa terhubung. Periksa internet lalu coba lagi.');
      else sRetry();
    });
    p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});
  }else if(ME.peer.open)sDial();
}
function sDial(){
  clearTimeout(ME.toT);
  const c=ME.peer.connect(PEER_PREFIX+ME.code,{reliable:true});ME.conn=c;
  ME.toT=setTimeout(()=>{if(!c.open){try{c.close()}catch(e){}if(!ME.joined)sFail('Tidak bisa terhubung. Cek kode dan internet.');else sRetry()}},10000);
  c.on('open',()=>{clearTimeout(ME.toT);c.send({t:'join',pid:ME.pid,name:ME.name,veh:ME.veh})});
  c.on('data',onStudentMsg);
  const lost=()=>{if(c!==ME.conn||ME.stop)return;if(!ME.joined){return}sRetry()};
  c.on('close',lost);c.on('error',lost);
  clearInterval(ME.pingT);ME.pingT=setInterval(()=>{if(ME.conn&&ME.conn.open)try{ME.conn.send({t:'ping'})}catch(e){}},5000);
}
function sRetry(){
  if(ME.stop||ME.retryT)return;
  ME.reconn=true;if(ME.status!=='kicked')render();
  ME.retryT=setTimeout(()=>{ME.retryT=null;if(!ME.stop)sConnect()},2000);
}
function sFail(msg){sStop();ME.err=msg;ME.status='idle';render()}
function sStop(){ME.stop=true;clearTimeout(ME.toT);clearTimeout(ME.retryT);ME.retryT=null;clearInterval(ME.pingT);try{ME.conn&&ME.conn.close()}catch(e){}try{ME.peer&&ME.peer.destroy()}catch(e){}ME.peer=null;ME.conn=null;ME.joined=false;ME.reconn=false}
function onStudentMsg(m){
  if(!m||typeof m!=='object')return;
  ME.reconn=false;
  switch(m.t){
    case 'joined':ME.joined=true;ME.name=m.name;ME.veh=m.veh;ME.pid=m.pid;store.set('plks_me',{code:ME.code,pid:ME.pid,name:ME.name,veh:ME.veh});ME.status='waiting';sfx.join();break;
    case 'err':ME.err=m.msg;ME.status='idle';sStop();break;
    case 'lobby':ME.status='waiting';ME.lobbyN=m.n;ME.res=null;ME.fin=null;break;
    case 'count':ME.status='count';ME.count=m.c;m.c>0?sfx.tick():sfx.go();break;
    case 'q':ME.q=m;ME.qi=m.qi;ME.picked=m.picked;ME.res=null;ME.paused=!!m.paused;ME.pausedRem=m.rem;ME.deadline=Date.now()+m.rem;ME.status=m.picked!=null?'answered':'q';break;
    case 'pause':ME.paused=true;ME.pausedRem=Math.max(0,ME.deadline-Date.now());break;
    case 'resume':ME.paused=false;ME.deadline=Date.now()+m.rem;break;
    case 'res':ME.res=m;ME.status='res';m.ok?sfx.ok():sfx.soft();break;
    case 'fin':ME.fin=m;ME.status='fin';sfx.win();celebrate();break;
    case 'kicked':ME.status='kicked';sStop();break;
    case 'end':ME.status='ended';sStop();break;
    default:return;
  }
  render();
}
function sAnswer(k){
  if(ME.status!=='q'||ME.paused)return;
  ME.picked=k;ME.status='answered';sfx.click();
  try{ME.conn.send({t:'ans',qi:ME.qi,opt:k})}catch(e){}
  render();
}
function sRem(){return ME.paused?ME.pausedRem:Math.max(0,ME.deadline-Date.now())}
setInterval(()=>{
  if(S.role!=='student'||(ME.status!=='q'&&ME.status!=='answered'))return;
  const r=sRem(),t=$('#sTime'),b=$('#sBar');
  if(t){t.textContent=Math.ceil(r/1000);t.classList.toggle('low',r<=5000)}
  if(b&&ME.q)b.style.width=(100*r/ME.q.dur)+'%';
  if(r<=0&&ME.status==='q'&&!ME.paused){ME.status='answered';ME.picked=null;ME.timeup=true;render()}
},150);
function stuTop(){return `<div class="top"><span class="logo disp">QUIZ RACE</span><span class="row" style="gap:6px;flex-wrap:nowrap">${ME.name?`<b>${esc(ME.name)}</b>`:''}${ME.veh>=0&&ME.joined?carSVG(ME.veh,56):''}<button data-act="sound" style="padding:.2em .7em;min-height:36px">${SET.sound?'Suara':'Hening'}</button></span></div>`}
function miniBoard(top,pid){return `<div class="mini">${top.map((r,i)=>`<div class="${r.pid===pid?'me':''}"><span class="rk ${i<3?'r'+(i+1):''}">${i+1}</span>${carSVG(r.v,40)}<span>${esc(r.n)}</span><span class="s">${fmt(r.s)}</span></div>`).join('')}</div>`}
function studentScreen(){
  const f=S.form;
  let b='';
  switch(ME.status){
    case 'idle':
      b=`<div class="card" style="display:grid;gap:14px"><h2>Ayo gabung balapan!</h2>
      <div><label for="fCode">Kode permainan</label><input id="fCode" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="6 angka dari guru" value="${esc(f.code)}" style="font-size:1.6rem;letter-spacing:.2em;text-align:center"></div>
      <div><label for="fName">Nama panggilan</label><input id="fName" maxlength="14" autocomplete="off" placeholder="Contoh: Andi" value="${esc(f.name)}"></div>
      <div><label>Pilih mobil</label><div class="vgrid">${VEH.map((v,i)=>`<button class="vbtn ${f.veh===i?'on':''}" data-act="pickveh" data-i="${i}" aria-label="Mobil ${v.n}">${carSVG(i,64)}</button>`).join('')}<button class="vbtn rand ${f.veh<0?'on':''}" data-act="pickveh" data-i="-1">Acak</button></div></div>
      ${ME.err?`<div class="err" role="alert">${esc(ME.err)}</div>`:''}
      <button class="btn-main btn-lg" data-act="sjoin">Gabung</button></div>
      <button class="btn-ghost" data-act="home">Kembali</button>`;break;
    case 'connecting':b=`<div class="bigmsg"><div class="spin"></div><h2>Menghubungkan…</h2><p>Sebentar ya.</p></div>`;break;
    case 'waiting':b=`<div class="bigmsg"><div>${carSVG(ME.veh,190)}</div><h2>Berhasil bergabung!</h2><p style="font-weight:800;font-size:1.2rem">Halo, ${esc(ME.name)}. Tunggu guru memulai permainan.</p><div class="spin" style="width:30px;height:30px;border-width:5px"></div></div>`;break;
    case 'count':b=`<div class="bigmsg"><div class="disp" style="font-size:9rem;color:var(--orange)" aria-live="assertive">${ME.count>0?ME.count:'MULAI!'}</div></div>`;break;
    case 'q':case 'answered':{
      const q=ME.q,prog=Array.from({length:q.n},(_,i)=>`<i class="${i<q.qi?'d':i===q.qi?'c':''}"></i>`).join('');
      const ans=ME.status==='answered';
      b=`<div class="sprog" aria-label="Soal ${q.qi+1} dari ${q.n}">${prog}</div>
      <div class="row" style="flex-wrap:nowrap"><div class="timer" id="sTime" style="width:64px;height:64px;font-size:2rem">${Math.ceil(sRem()/1000)}</div><div class="grow"><small>Soal ${q.qi+1} dari ${q.n}</small><div class="tbar" style="margin-top:6px"><i id="sBar" style="width:${100*sRem()/q.dur}%"></i></div></div></div>
      ${ME.paused?'<div class="pausebar">Permainan dijeda guru</div>':''}
      <div class="sq">${esc(q.text)}</div>
      <div class="sopts">${q.opts.map((o,i)=>`<button class="sopt ${['k0','k1','k2','k3'][i]} ${ans?(ME.picked===o.k?'picked':'dim'):''}" data-act="sans" data-k="${o.k}" ${ans?'disabled':''}><span class="l">${LETTERS[i]}</span><span>${esc(o.txt)}</span></button>`).join('')}</div>
      ${ans?`<div class="pausebar" style="background:#e6f2fb;border-color:#9cc7e6" role="status">${ME.picked!=null?'Jawaban terkirim! Menunggu hasil...':'Waktu habis. Menunggu hasil...'}</div>`:''}`;break}
    case 'res':{
      const r=ME.res,right=r.opts[r.correct],L=LETTERS[(ME.q.opts.findIndex(o=>o.k===r.correct))];
      b=`<div class="res ${r.ok?'good':'soft'}">${r.ok?`<div class="disp" style="font-size:1.8rem;color:var(--ok)">Benar! Hebat!</div><div class="pts">+${fmt(r.pts)}</div>`:`<div class="disp" style="font-size:1.7rem;color:#9a5b00">${r.answered?'Belum tepat, ayo semangat!':'Waktu habis, tidak apa-apa!'}</div><div class="pts" style="color:#9a5b00">+0</div>`}
      <div style="font-weight:800">Jawaban benar: ${L}. ${esc(right)}</div><div>${esc(r.explanation)}</div></div>
      <div class="card" style="text-align:center"><small>Total skor</small><div class="disp" style="font-size:2.4rem;color:var(--palm)">${fmt(r.total)}</div><b>Peringkat ${r.rank} dari ${r.of}</b></div>
      ${miniBoard(r.top,ME.pid)}<p style="text-align:center;font-weight:800">${r.last?'Menunggu hasil akhir…':'Soal berikutnya segera muncul'}</p>`;break}
    case 'fin':{
      const f2=ME.fin,medal=f2.rank<=3?`Selamat! Kamu juara ${f2.rank}!`:'Kamu hebat! Permainan selesai.';
      b=`<div class="bigmsg"><div>${carSVG(ME.veh,170)}</div><h2>${medal}</h2><div class="card" style="width:100%"><small>Skor akhir</small><div class="disp" style="font-size:3rem;color:var(--palm)">${fmt(f2.total)}</div><b>Peringkat ${f2.rank} dari ${f2.of} · ${f2.ok} dari ${f2.n} benar</b></div>${miniBoard(f2.top,ME.pid)}<p>Menunggu guru. Jika guru main lagi, kamu akan masuk otomatis.</p></div>`;break}
    case 'kicked':b=`<div class="bigmsg"><h2>Kamu keluar dari permainan</h2><p>Tanyakan ke guru jika ini keliru.</p><button class="btn-main" data-act="home">Kembali</button></div>`;break;
    case 'ended':b=`<div class="bigmsg"><h2>Permainan selesai</h2><p>Terima kasih sudah bermain!</p><button class="btn-main" data-act="home">Kembali</button></div>`;break;
  }
  const rc=ME.reconn&&ME.joined?'<div class="pausebar" role="status">Terputus. Menyambung kembali…</div>':'';
  return `<div class="stu">${stuTop()}${rc}${b}</div>`;
}

/* =====================================================================
   RENDER, EVENT, BOOT
   ===================================================================== */
function landing(){
  const palms=[0,1,2,3,4,5,6,7].map(i=>palmSVG(86+((i*29)%44))).join('');
  return `<div class="land"><section class="hero"><div class="sun"></div><div class="cl c1"></div><div class="cl c2"></div>
  <span class="badge">${ic('flag')} PLKS Kelas 3 · Membuka Lahan Ramah Lingkungan</span>
  <h1>QUIZ <span>RACE</span></h1>
  <p class="sub">Jawab cepat dan benar, mobilmu melaju paling depan.</p>
  <div class="scene"><div class="hill a"></div><div class="hill b"></div><div class="grass"></div><div class="palmrow">${palms}</div><div class="rd"></div>
   <div class="cc x1">${carSVG(0,110)}</div><div class="cc x2">${carSVG(1,110)}</div><div class="cc x3">${carSVG(5,110)}</div></div></section>
  <div class="roles"><button class="role rs" data-act="role" data-r="student"><span class="big">${ic('flag')}</span><span><h3>Saya Siswa</h3><span class="d">Masukkan kode dari guru dan ikut balapan.</span></span></button>
  <button class="role rt" data-act="role" data-r="teacher"><span class="big">${ic('layout-dashboard')}</span><span><h3>Saya Guru</h3><span class="d">Kelola soal, buat ruang, dan lihat laporan nilai.</span></span></button></div>
  <div class="feats"><span>${ic('timer')} Real-time</span><span>${ic('trophy')} Skor adil</span><span>${ic('users')} Banyak peserta</span><span>${ic('download')} Laporan CSV</span></div></div>`;
}
let lastKey='';
function anim(){
  if(!window.gsap)return;
  const t=(sel,v)=>{const e=$$(sel);if(e.length)gsap.from(e,{clearProps:'transform,opacity',...v})};
  t('.hero .badge,.hero .sub',{y:16,opacity:0,duration:.5,stagger:.12});
  t('.hero h1',{y:40,opacity:0,duration:.7,ease:'back.out(1.6)'});
  t('.role',{y:30,opacity:0,duration:.5,stagger:.12,delay:.2});
  t('.feats span',{y:12,opacity:0,duration:.4,stagger:.07,delay:.4});
  t('.bigcount span',{scale:.2,opacity:0,duration:.55,ease:'back.out(2.4)'});
  t('.qcard',{y:24,opacity:0,duration:.45});
  t('.qcard .opt',{y:16,opacity:0,duration:.35,stagger:.07,delay:.15});
  t('.lcard',{y:24,opacity:0,duration:.5,stagger:.12});
  t('.tmain>*',{y:14,opacity:0,duration:.35,stagger:.05});
  t('.stu .bigmsg>*,.stu .res,.stu .sopt,.stu .mini div',{y:14,opacity:0,duration:.35,stagger:.06});
}
function post(){
  if(window.lucide&&lucide.createIcons){try{lucide.createIcons()}catch(e){}}
  if(S.role==='teacher'&&G.active&&G.phase==='lobby'){const q=$('#qr'),u=joinURL();if(q&&u&&window.QRCode){try{new QRCode(q,{text:u,width:210,height:210,colorDark:'#0f5230',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){}}}
  const key=S.role+'|'+(S.role==='student'?(ME.status==='answered'?'q':ME.status)+ME.qi+(ME.status==='count'?ME.count:''):G.active?G.phase+G.qi+(G.phase==='count'?G.count:''):S.tview);
  if(key!==lastKey){lastKey=key;anim()}
}
function render(){
  const app=$('#app');
  const sy=window.scrollY;
  const box0=G.arena&&$('.scrollbox',G.arena);const st=box0?box0.scrollTop:0;
  if(S.role===null){app.innerHTML=landing()}
  else if(S.role==='student'){app.innerHTML=studentScreen()}
  else if(G.active){
    app.innerHTML=hostScreen();
    const slot=$('#arenaSlot');
    if(slot&&G.arena){slot.appendChild(G.arena);void G.arena.offsetWidth;updateArena();const b=$('.scrollbox',G.arena);if(b)b.scrollTop=st}
  }else app.innerHTML=teacherShell();
  if(S.role==='teacher'&&!G.active&&sy)window.scrollTo(0,sy);
  syncMusic();
  post();
}
function qOf(el){return curQuiz().questions[+el.dataset.qi]}
const ACT={
  role(el){S.role=el.dataset.r;ac();if(S.role==='student'){ME.status='idle';ME.err='';const c=new URLSearchParams(location.search).get('kode');if(c)S.form.code=c.replace(/\D/g,'').slice(0,6);if(sess&&!S.form.name){S.form.name=sess.name||'';S.form.veh=Number.isInteger(sess.veh)?sess.veh:-1;if(!S.form.code&&sess.code)S.form.code=sess.code}}render()},
  home(){if(S.role==='student')sStop();ME.status='idle';S.role=null;render()},
  tview(el){S.tview=el.dataset.v;S.confirm=null;render();window.scrollTo(0,0)},
  selquiz(el){S.selQuiz=el.dataset.id;store.set('plks_sel',S.selQuiz);render()},
  open(){openRoom()},
  start(){startGame()},next(){nextQuestion()},pause(){pauseGame()},resume(){resumeGame()},
  endgame(){finishGame()},again(){playAgain()},leave(){leaveRoom()},bots(){addBots()},
  kick(el){kick(el.dataset.pid)},
  toreport(){leaveRoom();S.tview='report';render()},
  board(){G.board=true;render()},closeboard(el,e){if(e.target===el||el.tagName==='BUTTON'){G.board=false;render()}},
  toggleAll(){G.showAll=!G.showAll;updateArena()},
  copylink(){const u=joinURL();(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Tautan disalin')).catch(()=>toast(u))},
  sound(){SET.sound=!SET.sound;saveSet();render()},music(){SET.music=!SET.music;saveSet();render()},
  csv(el){const r=HISTORY.find(h=>h.id===el.dataset.id);if(r)downloadCSV(r)},
  openrep(el){S.reportId=el.dataset.id;S.tview='report';render()},
  createquiz(){
    const t=$('#nTitle').value.trim();if(!t){toast('Tulis judul kuis dulu.');return}
    const q={id:uid(),title:t,description:$('#nDesc').value.trim(),subject:$('#nSub').value.trim(),grade:$('#nGrade').value.trim(),questions:[Q('',['','','',''],0,'')]};
    QUIZZES.push(q);S.selQuiz=q.id;S.open[q.questions[0].id]=true;saveQ();store.set('plks_sel',S.selQuiz);S.tview='bank';render();
  },
  dupquiz(){const c=JSON.parse(JSON.stringify(curQuiz()));c.id=uid();c.title+=' (salinan)';c.questions.forEach(q=>q.id=uid());QUIZZES.push(c);S.selQuiz=c.id;saveQ();render();toast('Kuis digandakan')},
  delquiz(){if(S.confirm!=='quiz'){S.confirm='quiz';render();return}QUIZZES=QUIZZES.filter(q=>q.id!==S.selQuiz);S.selQuiz=QUIZZES[0].id;S.confirm=null;saveQ();render()},
  addq(){const q=Q('',['','','',''],0,'');curQuiz().questions.push(q);S.open[q.id]=true;saveQ();render()},
  qedit(el){S.open[el.dataset.id]=!S.open[el.dataset.id];render()},
  qdup(el){const qs=curQuiz().questions,i=+el.dataset.i,c=JSON.parse(JSON.stringify(qs[i]));c.id=uid();qs.splice(i+1,0,c);saveQ();render()},
  qdel(el){const k='q'+el.dataset.id;if(S.confirm!==k){S.confirm=k;render();return}const qs=curQuiz().questions;qs.splice(+el.dataset.i,1);S.confirm=null;saveQ();render()},
  qup(el){const qs=curQuiz().questions,i=+el.dataset.i;if(i>0){[qs[i-1],qs[i]]=[qs[i],qs[i-1]];saveQ();render()}},
  qdown(el){const qs=curQuiz().questions,i=+el.dataset.i;if(i<qs.length-1){[qs[i+1],qs[i]]=[qs[i],qs[i+1]];saveQ();render()}},
  pickveh(el){S.form.veh=+el.dataset.i;render();},
  sjoin(){S.form.code=($('#fCode')||{}).value||S.form.code;S.form.name=($('#fName')||{}).value||S.form.name;sJoin()},
  sans(el){sAnswer(+el.dataset.k)}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=ACT[el.dataset.act];if(f){if(el.dataset.act!=='closeboard'||true)f(el,e)}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='fCode'){el.value=el.value.replace(/\D/g,'').slice(0,6);S.form.code=el.value;return}
  if(el.id==='fName'){S.form.name=el.value;return}
  if(el.dataset.qf){
    const q=qOf(el),f=el.dataset.qf;
    if(/^o\d$/.test(f))q.options[+f[1]]=el.value;
    else if(f==='duration'||f==='points')q[f]=Math.max(0,+el.value||0);
    else q[f]=el.value;
    saveQ();
  }else if(el.dataset.mf){curQuiz()[el.dataset.mf]=el.value;saveQ()}
  else if(el.dataset.setn){SET[el.dataset.setn]=clamp(+el.value||9,4,30);saveSet()}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.chg==='selquiz'){S.selQuiz=el.value;store.set('plks_sel',S.selQuiz);S.confirm=null;render();return}
  if(el.dataset.correct!==undefined){qOf(el).correct=+el.value;saveQ();return}
  if(el.dataset.chk!==undefined){curQuiz().questions[+el.dataset.chk].use=el.checked;saveQ();render();return}
  if(el.dataset.set){SET[el.dataset.set]=el.checked;saveSet();syncMusic()}
});
window.addEventListener('beforeunload',e=>{if(G.active&&G.phase!=='lobby'&&G.phase!=='fin'){e.preventDefault();e.returnValue=''}});

/* Boot: tautan siswa (?kode=...) langsung membuka form siswa */
(function boot(){
  const c=new URLSearchParams(location.search).get('kode');
  if(c&&/^\d{6}$/.test(c)){ACT.role({dataset:{r:'student'}});return}
  render();
})();
</script>
